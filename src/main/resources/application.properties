spring.application.name=pharmacyservice

server.port=8082


app.cors.allowed-origin-patterns=http://localhost:3000,http://127.0.0.1:3000,http://117.16.154.233:18080

spring.datasource.url=${PHARMACY_DB_URL:jdbc:oracle:thin:@seoulit.pe.kr:1521/FREEPDB1}
spring.datasource.username=${PHARMACY_DB_USERNAME:pharmacy}
spring.datasource.password=${PHARMACY_DB_PASSWORD:pharmacy}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=PHARMACY
spring.jpa.open-in-view=false

public-data.medication.base-url=${PUBLIC_DATA_MEDICATION_BASE_URL:https://apis.data.go.kr/1471000/MdcinGrnIdntfcInfoService03/getMdcinGrnIdntfcInfoList03}
public-data.medication.service-key=${PUBLIC_DATA_MEDICATION_SERVICE_KEY:bf3a67e34427e8e3bd9aa909b0458add47a81d1561e327660752e2e767a2713b}

# admin-service 공통코드 로컬캐시(CommonCodeCache)용 호출 주소. hisfrontend의 ADMIN_API_ORIGIN
# 기본값(localhost:9191)과 동일하게 맞춤 — MSA를 전부 로컬/원격 한 대에서 같이 띄우는 구성이라
# admin만 9191, 나머지는 808x.
admin.api.base-url=${ADMIN_API_BASE_URL:http://localhost:9191}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=pharmacyservice
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=kr.co.seoulit.his.pharmacyservice.prescription.dto
spring.kafka.consumer.properties.spring.json.value.default.type=kr.co.seoulit.his.pharmacyservice.prescription.dto.PharmacyOrderRequestedEvent

pharmacy.kafka.topic.prescription-created=${KAFKA_TOPIC_PRESCRIPTION_CREATED:opd.pharmacy-order.requested.v1}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
pharmacy.kafka.topic.prescription-resulted=${KAFKA_TOPIC_PRESCRIPTION_RESULTED:phm.pharmacy-order.resulted.v1}
